baseURL = ""
title = "Fromago · enquêtes"
defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = true
enableInlineShortcodes = true
removePathAccents = true

# Dev/`hugo server` : thèmes résolus en local via `themes/` (symlinks).
# La prod utilise `config/production/hugo.toml` (modules GitHub).
theme = ["minigo", "fromago"]

[pagination]
  pagerSize = 10

[params]
  targetrepo = "lowdit/fromago/"

[params.lowdit]
  logo = "logos/fromago.png"
  socialImage = "/assets/social/twittercard-default.png"
  faviconDir = "favicons/fromago"
  siteProfile = "inquiry"
  view = "inquiry"
  homeEyebrow = "Fromago · enquêtes"
  # Formulaires de démonstration : champs figés, aucune réponse transmise.
  formsDemo = true

[[menus.main]]
  name = "Accueil"
  url = "/"
  weight = 1
[[menus.main]]
  name = "Installation"
  url = "/installation/"
  weight = 90

[languages]
  [languages.fr]
    locale = "fr"
    label = "Français"
    weight = 1
    title = "Fromago"
  [languages.en]
    locale = "en"
    label = "English"
    weight = 2
    title = "Fromago"

[markup.goldmark.renderer]
  unsafe = true
