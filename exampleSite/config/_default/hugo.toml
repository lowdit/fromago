baseURL = ""
title = "Fromago · enquêtes"
defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = true
enableInlineShortcodes = true
removePathAccents = true

# Modules résolus sur les dépôts locaux par bin/hugo.work (aussi pour hugo server).
# La prod (config/production) garde les versions épinglées par go.mod.
theme = ["github.com/lowdit/fromago", "github.com/lowdit/lowdit-kit"]

[pagination]
  pagerSize = 10

[params]
  targetrepo = "lowdit/fromago/"

[params.lowdit]
  logo = "logos/fromago.png"
  socialImage = "/assets/social/twittercard-default.png"
  faviconDir = "favicons/fromago"
  siteProfile = "inquiry"
  view = "inquiry"
  homeEyebrow = "Fromago · enquêtes"
  # Formulaires de démonstration : champs figés, aucune réponse transmise.
  formsDemo = true

[[menus.main]]
  name = "Accueil"
  url = "/"
  weight = 1
[[menus.main]]
  name = "Installation"
  url = "/installation/"
  weight = 90

[languages]
  [languages.fr]
    locale = "fr"
    label = "Français"
    weight = 1
    title = "Fromago"
  [languages.en]
    locale = "en"
    label = "English"
    weight = 2
    title = "Fromago"

[markup.goldmark.renderer]
  unsafe = true

[module]
  # Espace de travail local : lowdit-kit et les modules du disque.
  workspace = "../../bin/hugo.work"
