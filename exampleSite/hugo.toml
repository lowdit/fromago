baseURL = "/"
paginate = "10"

title = "Fromago"
themesDir = "../.."
theme = "fromago"

defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = true
enableInlineShortcodes = true
removePathAccents = true

[params]
  targetrepo = "lowdit/fromago/" ## Eg. of target repo

[languages]
  [languages.fr]
    locale ="fr"
    label ="Français"
    weight = 1
    title = "Fromago"
  [languages.en]
    locale ="en"
    label ="English"
    weight = 2
    title = "Fromago"

