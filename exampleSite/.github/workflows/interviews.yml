name: 'Receive Interviews'

## Payload attendu (émis par l'app public-action-trigger, endpoint public) :
## { "event_type": "interview", "client_payload": { "data": {
##     "slugpath": "enquete-organisme", "slugname": "jean-dupont",
##     "name": "Jean Dupont", "date": "2026-10-16", ... } } }
##
## Variante du workflow de démo : les réponses sont poussées vers la branche
## `content` (site de rapport), d'où `base: content`.
##
## SÉCURITÉ : l'entrée est PUBLIQUE. Ne jamais interpoler un champ du payload
## directement dans un bloc `run:` (injection shell). Tous les champs passent par
## un bloc `env:` (posé par le runner, non interprété par le shell), puis sont
## utilisés entre guillemets et validés.

on:
  repository_dispatch:
    types: [interview]

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Valider les champs (anti-injection / anti-traversée)
        env:
          SLUGPATH: ${{ github.event.client_payload.data.slugpath }}
          SLUGNAME: ${{ github.event.client_payload.data.slugname }}
        run: |
          set -euo pipefail
          if [[ -z "${SLUGPATH}" ]]; then
            echo "slugpath manquant"; exit 1
          fi
          [[ "${SLUGPATH}" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]] || { echo "slugpath invalide"; exit 1; }
          [[ "${SLUGNAME}" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "slugname invalide"; exit 1; }

          base="$(realpath -m content/interviews)"
          target="$(realpath -m "content/interviews/${SLUGPATH}")"
          case "${target}" in
            "${base}"/*) ;;
            *) echo "chemin hors zone"; exit 1 ;;
          esac

      - name: Préparer les métadonnées
        id: preprocess
        env:
          NAME: ${{ github.event.client_payload.data.name }}
          SLUGPATH: ${{ github.event.client_payload.data.slugpath }}
          SLUGNAME: ${{ github.event.client_payload.data.slugname }}
          PDATE: ${{ github.event.client_payload.data.date }}
        run: |
          set -euo pipefail
          echo "_id=$(uuidgen)" >> "${GITHUB_OUTPUT}"
          echo "name=${NAME}" >> "${GITHUB_OUTPUT}"
          echo "slugpath=${SLUGPATH}" >> "${GITHUB_OUTPUT}"
          echo "slugname=${SLUGNAME}" >> "${GITHUB_OUTPUT}"
          echo "date=${PDATE:-$(date +%F)}" >> "${GITHUB_OUTPUT}"

      - name: Écrire le fichier de réponses
        env:
          SLUGPATH: ${{ steps.preprocess.outputs.slugpath }}
          SLUGNAME: ${{ steps.preprocess.outputs.slugname }}
          DATE: ${{ steps.preprocess.outputs.date }}
          PAYLOAD: ${{ toJson(github.event.client_payload.data) }}
        run: |
          set -euo pipefail
          dir="content/interviews/${SLUGPATH}"
          mkdir -p -- "${dir}"
          # Le JSON est un sous-ensemble du YAML : front matter valide.
          printf -- '---\n%s\n---\n\n' "${PAYLOAD}" > "${dir}/${SLUGNAME}-${DATE}.md"

      - name: Créer la Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "${{ steps.preprocess.outputs.name }} — réponses sur ${{ steps.preprocess.outputs.slugpath }}"
          base: content
          branch: interviews-${{ steps.preprocess.outputs._id }}
          delete-branch: true
          title: "Réponses de ${{ steps.preprocess.outputs.name }} — ${{ steps.preprocess.outputs.slugpath }}"
          body: |
            Réponses reçues pour **${{ steps.preprocess.outputs.slugpath }}**.

            Fichier : `content/interviews/${{ steps.preprocess.outputs.slugpath }}/${{ steps.preprocess.outputs.slugname }}-${{ steps.preprocess.outputs.date }}.md`

            À vérifier avant fusion (contenu, données personnelles).
          draft: false
